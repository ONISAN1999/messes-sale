name: Build Messes Sale APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (preinstalled on runner)
        run: |
          SDK=$ANDROID_HOME
          [ -z "$SDK" ] && SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKM=$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MessesSale.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: messes-sale-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release (direct APK link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Messes Sale build ${{ github.run_number }}
          files: MessesSale.apk

      - name: Commit APK to dist/ (for direct git download)
        run: |
          mkdir -p dist
          cp MessesSale.apk dist/MessesSale.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/MessesSale.apk
          git commit -m "dist: MessesSale.apk build ${{ github.run_number }} [skip ci]" || exit 0
          git push
